  <ellipse cx="240" cy="132" rx="20" ry="24" fill="#F6D98A"></ellipse>
  <path d="M229 130 q4 4 8 0 M243 130 q4 4 8 0" fill="none" stroke="#1C1838" stroke-width="2.5" stroke-linecap="round"></path>
  <path d="M236 144 q4 3 8 0" fill="none" stroke="#C08A1E" stroke-width="2.5" stroke-linecap="round"></path>

