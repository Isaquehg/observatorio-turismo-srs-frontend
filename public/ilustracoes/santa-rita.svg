<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520">
  <!-- Estátua de Santa Rita de Cássia na entrada da cidade, no estilo das ilustrações do Observatório -->

  <defs>
    <!-- Paisagem recortada no círculo de fundo, alongado para baixo para o chão ficar inteiro -->
    <clipPath id="paisagem"><circle cx="246" cy="250" r="212"></circle><rect x="40" y="250" width="412" height="230" rx="60"></rect></clipPath>
  </defs>

  <!-- Fundo -->
  <circle cx="246" cy="250" r="212" fill="#EDE7FA"></circle>
  <rect x="64" y="96" width="96" height="26" rx="13" fill="#FFFFFF"></rect>
  <rect x="92" y="78" width="52" height="26" rx="13" fill="#FFFFFF"></rect>
  <rect x="330" y="132" width="78" height="22" rx="11" fill="#FFFFFF"></rect>

  <g clip-path="url(#paisagem)">
  <!-- Prédios da avenida -->
  <g>
    <rect x="334" y="214" width="46" height="250" rx="6" fill="#B986ED"></rect>
    <rect x="386" y="246" width="40" height="218" rx="6" fill="#9F7BE6"></rect>
    <g fill="#FFFFFF" opacity=".85">
      <rect x="342" y="228" width="10" height="8" rx="2"></rect><rect x="362" y="228" width="10" height="8" rx="2"></rect>
      <rect x="342" y="248" width="10" height="8" rx="2"></rect><rect x="362" y="248" width="10" height="8" rx="2"></rect>
      <rect x="342" y="268" width="10" height="8" rx="2"></rect><rect x="362" y="268" width="10" height="8" rx="2"></rect>
      <rect x="342" y="288" width="10" height="8" rx="2"></rect><rect x="362" y="288" width="10" height="8" rx="2"></rect>
      <rect x="342" y="308" width="10" height="8" rx="2"></rect><rect x="362" y="308" width="10" height="8" rx="2"></rect>
      <rect x="394" y="260" width="9" height="8" rx="2"></rect><rect x="410" y="260" width="9" height="8" rx="2"></rect>
      <rect x="394" y="280" width="9" height="8" rx="2"></rect><rect x="410" y="280" width="9" height="8" rx="2"></rect>
      <rect x="394" y="300" width="9" height="8" rx="2"></rect><rect x="410" y="300" width="9" height="8" rx="2"></rect>
      <rect x="394" y="320" width="9" height="8" rx="2"></rect><rect x="410" y="320" width="9" height="8" rx="2"></rect>
    </g>
  </g>

  <!-- Morros e chão -->
  <path d="M34 400 L110 330 Q124 318 138 330 L200 384 L280 340 Q294 332 308 340 L452 410 V470 H34 Z" fill="#B986ED" opacity=".55"></path>
  <path d="M30 430 Q140 392 250 418 T462 412 V480 H30 Z" fill="#F3B8F7"></path>
  <path d="M22 460 Q160 432 260 452 T470 448 V490 H22 Z" fill="#5FE6E0"></path>
  </g>
  <ellipse cx="240" cy="474" rx="118" ry="10" fill="#1C1838" opacity=".12"></ellipse>

  <!-- Pedestal: tronco de árvore -->
  <path d="M188 384 L182 462 Q240 478 298 462 L292 384 Z" fill="#D9A62E"></path>
  <path d="M206 396 L202 452 M240 398 L240 462 M272 396 L276 452" stroke="#C08A1E" stroke-width="5" stroke-linecap="round"></path>
  <path d="M182 462 Q164 470 160 478 H200 Z M298 462 Q316 470 320 478 H280 Z" fill="#C08A1E"></path>
  <ellipse cx="240" cy="384" rx="54" ry="11" fill="#F0C85A"></ellipse>
  <ellipse cx="240" cy="384" rx="34" ry="6" fill="none" stroke="#D9A62E" stroke-width="3"></ellipse>

