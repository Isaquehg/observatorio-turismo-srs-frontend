    <path d="M326 88 L306 74 M322 104 L300 94 M318 120 L298 112 M330 74 L316 58"></path>
  </g>
  <circle cx="303" cy="150" r="11" fill="#F6D98A"></circle>

  <!-- Braço com o crucifixo -->
  <path d="M206 192 Q206 232 238 238" fill="none" stroke="#FADA77" stroke-width="26" stroke-linecap="round"></path>
  <path d="M206 192 Q206 232 238 238" fill="none" stroke="#E9BE3F" stroke-width="4" stroke-linecap="round" opacity=".7"></path>
  <rect x="242" y="196" width="7" height="50" rx="3" fill="#1C1838"></rect>
  <rect x="230" y="210" width="31" height="7" rx="3" fill="#1C1838"></rect>
  <circle cx="244" cy="238" r="11" fill="#F6D98A"></circle>

  <!-- Rosas de Santa Rita -->
  <g>
    <path d="M196 380 q-6 -14 6 -18 M282 380 q8 -14 -4 -18" fill="none" stroke="#2BB5AE" stroke-width="4" stroke-linecap="round"></path>
    <ellipse cx="190" cy="372" rx="9" ry="5" fill="#2BB5AE" transform="rotate(-30 190 372)"></ellipse>
    <ellipse cx="290" cy="372" rx="9" ry="5" fill="#2BB5AE" transform="rotate(30 290 372)"></ellipse>
    <circle cx="204" cy="378" r="11" fill="#C750D6"></circle><circle cx="204" cy="378" r="5" fill="#9B2BAE"></circle>
    <circle cx="224" cy="384" r="9" fill="#F3B8F7"></circle><circle cx="224" cy="384" r="4" fill="#C750D6"></circle>
    <circle cx="258" cy="384" r="9" fill="#F3B8F7"></circle><circle cx="258" cy="384" r="4" fill="#C750D6"></circle>
    <circle cx="278" cy="378" r="11" fill="#C750D6"></circle><circle cx="278" cy="378" r="5" fill="#9B2BAE"></circle>
    <circle cx="150" cy="456" r="9" fill="#C750D6"></circle><circle cx="150" cy="456" r="4" fill="#9B2BAE"></circle>
    <circle cx="332" cy="458" r="8" fill="#F3B8F7"></circle><circle cx="332" cy="458" r="3.5" fill="#C750D6"></circle>
  </g>

  <!-- Adesivos -->
  <g transform="translate(96 200)"><path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z" fill="#FADA77"></path></g>
  <circle cx="420" cy="196" r="12" fill="none" stroke="#5FE6E0" stroke-width="6"></circle>
  <path d="M70 300 c14 -18 28 18 42 0 s28 18 42 0" fill="none" stroke="#F3B8F7" stroke-width="9" stroke-linecap="round"></path>
</svg>
