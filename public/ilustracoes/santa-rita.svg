  <path d="M224 206 L214 372 M240 214 L240 384 M258 206 L268 372" stroke="#E9BE3F" stroke-width="6" stroke-linecap="round"></path>

  <!-- Véu -->
  <path d="M204 124 Q240 76 276 124 L292 204 Q240 188 188 204 Z" fill="#E9BE3F"></path>

